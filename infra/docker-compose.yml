services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quantara
      POSTGRES_USER: quantara
      POSTGRES_PASSWORD: quantara
    ports:
      - "5432:5432"
    volumes:
      - quantara-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantara"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/quantara
      DB_USERNAME: quantara
      DB_PASSWORD: quantara
      QUANTARA_WEB_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  quantara-postgres-data:
